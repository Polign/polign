[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llama-index-vector-stores-polign"
version = "0.1.0"
description = "LlamaIndex vector store for polign_db"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Polign" }]
keywords = ["llama-index", "llamaindex", "vector database", "vector store", "embeddings", "polign"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "llama-index-core>=0.13.0,<0.15",
    "polign>=0.7.0",
]

[project.optional-dependencies]
grpc = ["polign[grpc]>=0.7.0"]

[project.urls]
Homepage = "https://polign.com"
Documentation = "https://polign.com/python.html"
Repository = "https://github.com/Polign/polign"
Issues = "https://github.com/Polign/polign/issues"

[tool.hatch.build]
ignore-vcs = true

[tool.hatch.build.targets.sdist]
include = ["llama_index/", "tests/", "README.md", "LICENSE"]
exclude = ["**/__pycache__", "**/.pytest_cache"]

[tool.hatch.build.targets.wheel]
include = ["llama_index/"]

[tool.llamahub]
contains_example = false
import_path = "llama_index.vector_stores.polign"

[tool.llamahub.class_authors]
PolignVectorStore = "Polign"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
