[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recall-vapi"
version = "0.2.0"
description = "Typed, correctable caller memory for Vapi, backed by Recall by Polign"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Polign" }]
dependencies = ["polign-recall>=0.3.0", "polign>=0.7.0"]

[project.optional-dependencies]
fastapi = ["fastapi>=0.115,<1"]
dev = ["fastapi>=0.115,<1", "httpx>=0.27", "pytest>=8", "pytest-asyncio>=0.24", "uvicorn>=0.30,<1"]

[project.urls]
Homepage = "https://polign.com"
Repository = "https://github.com/Polign/polign"

[tool.hatch.build.targets.wheel]
packages = ["recall_vapi"]

[tool.hatch.build.targets.sdist]
include = ["recall_vapi/", "tests/", "README.md", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
