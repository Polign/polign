[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polign"
version = "0.7.0"
description = "Python client for polign_db, a vector database with hot/cold search and hybrid BM25 fusion"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Polign" }]
keywords = ["vector database", "vector search", "embeddings", "similarity search", "polign"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
# Pinned to the versions the vendored stubs in polign/_pb were generated
# with (grpc_tools.protoc); regenerate the stubs if you relax these.
grpc = ["grpcio>=1.80", "protobuf>=6.31,<7"]

[project.urls]
Homepage = "https://polign.com"
Documentation = "https://polign.com/python.html"
Repository = "https://github.com/Polign/polign"
Issues = "https://github.com/Polign/polign/issues"

# Explicit file selection with VCS ignores disabled. A .gitignore entry that
# matches "polign" (the CLI binary name) once made hatchling silently drop the
# package from the wheel; selecting files by hand keeps that from recurring.
[tool.hatch.build]
ignore-vcs = true

[tool.hatch.build.targets.sdist]
include = ["polign/", "tests/", "README.md", "LICENSE"]
exclude = ["**/__pycache__", "**/.pytest_cache"]

[tool.hatch.build.targets.wheel]
packages = ["polign"]

[tool.pytest.ini_options]
testpaths = ["tests"]
