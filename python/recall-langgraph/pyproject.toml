[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recall-langgraph"
version = "0.1.0"
description = "Resume LangGraph agents from their own records, backed by Recall by Polign"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Polign" }]
keywords = ["langgraph", "langchain", "agent memory", "resume", "recall", "polign"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "polign-recall>=0.4.0",
    "langgraph>=1.0,<2",
    "langchain-core>=1.0,<2",
]

[project.urls]
Homepage = "https://polign.com"
Documentation = "https://polign.com/integrations.html"
Repository = "https://github.com/Polign/polign"
Issues = "https://github.com/Polign/polign/issues"

[tool.hatch.build]
ignore-vcs = true

[tool.hatch.build.targets.sdist]
include = ["recall_langgraph/", "tests/", "README.md", "LICENSE"]
exclude = ["**/__pycache__", "**/.pytest_cache"]

[tool.hatch.build.targets.wheel]
packages = ["recall_langgraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
