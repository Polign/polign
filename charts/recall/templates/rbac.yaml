{{- if and .Values.kubernetes.enabled .Values.kubernetes.rbac.create }}
# recall serve verifies workload tokens with the TokenReview API, and reads a
# ServiceAccount only when the tenant comes from a label on it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-tokenreview
  labels:
    {{- include "recall.labels" . | nindent 4 }}
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
  {{- if .Values.kubernetes.tenantLabel }}
  - apiGroups: [""]
    resources: [serviceaccounts]
    verbs: [get]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-tokenreview
  labels:
    {{- include "recall.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-tokenreview
subjects:
  - kind: ServiceAccount
    name: {{ include "recall.serviceAccount" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
