{{- if and .Values.kubernetes.enabled .Values.kubernetes.rbac.create }}
# recall serve verifies workload tokens with the TokenReview API, reads a
# ServiceAccount only when the tenant comes from a label on it, and reads Pods
# (plus agent-sandbox Sandboxes and SandboxClaims) only when the agent comes
# from a pod label or the pod's SandboxClaim.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-tokenreview
  labels:
    {{- include "recall.labels" . | nindent 4 }}
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
  {{- if .Values.kubernetes.tenantLabel }}
  - apiGroups: [""]
    resources: [serviceaccounts]
    verbs: [get]
  {{- end }}
  {{- if or .Values.kubernetes.agentLabel .Values.kubernetes.sandboxClaims }}
  - apiGroups: [""]
    resources: [pods]
    verbs: [get]
  {{- end }}
  {{- if .Values.kubernetes.sandboxClaims }}
  - apiGroups: [agents.x-k8s.io]
    resources: [sandboxes]
    verbs: [get]
  - apiGroups: [extensions.agents.x-k8s.io]
    resources: [sandboxclaims]
    verbs: [get]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-tokenreview
  labels:
    {{- include "recall.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-tokenreview
subjects:
  - kind: ServiceAccount
    name: {{ include "recall.serviceAccount" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
