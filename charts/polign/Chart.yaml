apiVersion: v2
name: polign
description: Polign vector database backed by your object-store bucket
type: application
version: 0.2.0
appVersion: "0.6.6"
kubeVersion: ">=1.30.0-0"
home: https://polign.com
icon: https://polign.com/assets/favicon.svg
sources:
  - https://github.com/Polign/polign
keywords: [polign, vector-database, agent-memory]
maintainers:
  - name: Polign
    url: https://github.com/Polign
annotations:
  org.opencontainers.image.source: https://github.com/Polign/polign
  # Artifact Hub metadata. The chart installs on any conformant cluster, so it
  # is listed on a vendor-neutral index rather than in one cloud's catalog.
  artifacthub.io/category: database
  artifacthub.io/license: Apache-2.0
  artifacthub.io/prerelease: "true"
  artifacthub.io/images: |
    - name: polign-server
      image: ghcr.io/polign/polign-server:0.6.6
  artifacthub.io/links: |
    - name: Chart documentation
      url: https://github.com/Polign/polign/blob/main/charts/polign/README.md
    - name: Support
      url: https://github.com/Polign/polign/issues
  artifacthub.io/changes: |
    - kind: added
      description: Supply an API key from a Secret and the server registers it at startup, so installing needs no key minted by hand afterwards
    - kind: added
      description: Configurable startup probe budget, so a store whose restore runs long does not restart into the same replay for ever
    - kind: added
      description: Artifact Hub metadata, so the chart is discoverable from a vendor-neutral index
    - kind: added
      description: Sigstore keyless signature published beside the chart in the registry and verified at release
