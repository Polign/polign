apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "polign.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "polign.selector" . | nindent 4 }}
  ports:
    - {name: http, port: 23000, targetPort: http}
    - {name: grpc, port: 23001, targetPort: grpc}
