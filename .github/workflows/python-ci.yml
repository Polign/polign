name: python

on:
  push:
    branches: [main]
    paths: ["python/**", "proto/**", ".github/workflows/python-ci.yml"]
  pull_request:
    paths: ["python/**", "proto/**", ".github/workflows/python-ci.yml"]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        working-directory: python
        run: python -m pip install -e ".[grpc]" pytest
      - name: Unit tests
        working-directory: python
        run: pytest tests/test_unit.py tests/test_grpc_unit.py tests/test_filter_expr.py -q

  polign_db:
    # The wheel builder for the binary package, against synthetic archives.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wheel builder tests
        working-directory: python/polign_db
        run: |
          python -m pip install pytest
          pytest tests -q

  integration:
    # Runs the client against the released server binary, which is what
    # `pip install polign` users actually talk to. POLIGN_SERVER_VERSION
    # pins a release; unset, the fixture resolves the latest stable tag.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: python
        run: python -m pip install -e ".[grpc]" pytest
      - name: Download the latest polign-server release
        run: |
          set -euo pipefail
          tag="$(curl -fsSL -H "Authorization: Bearer ${{ github.token }}" https://api.github.com/repos/Polign/polign/releases/latest | python3 -c 'import sys,json; print(json.load(sys.stdin)["tag_name"])')"
          echo "resolved ${tag}"
          mkdir -p "$RUNNER_TEMP/polign"
          curl -fsSL "https://github.com/Polign/polign/releases/download/${tag}/polign_db_linux_amd64.tar.gz" | tar -xz -C "$RUNNER_TEMP/polign"
          echo "POLIGN_SERVER=$RUNNER_TEMP/polign/polign-server" >> "$GITHUB_ENV"
      - name: Integration tests
        working-directory: python
        run: pytest tests/test_integration.py -v

  langchain:
    # The LangChain vector store: unit tests on the supported range, then
    # LangChain's standard vector store suite against the latest server release.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        working-directory: python/langchain-polign
        run: |
          python -m pip install -e ../  # the client from this checkout, not PyPI
          python -m pip install -e ".[grpc]" pytest pytest-asyncio langchain-tests
      - name: Unit tests
        working-directory: python/langchain-polign
        run: pytest tests/unit_tests -q
      - name: Download the latest polign-server release
        run: |
          set -euo pipefail
          tag="$(curl -fsSL -H "Authorization: Bearer ${{ github.token }}" https://api.github.com/repos/Polign/polign/releases/latest | python3 -c 'import sys,json; print(json.load(sys.stdin)["tag_name"])')"
          echo "resolved ${tag}"
          mkdir -p "$RUNNER_TEMP/polign"
          curl -fsSL "https://github.com/Polign/polign/releases/download/${tag}/polign_db_linux_amd64.tar.gz" | tar -xz -C "$RUNNER_TEMP/polign"
          echo "POLIGN_SERVER=$RUNNER_TEMP/polign/polign-server" >> "$GITHUB_ENV"
      - name: Integration tests
        working-directory: python/langchain-polign
        run: pytest tests/integration_tests -v

  llamaindex:
    # The LlamaIndex vector store, tested against the latest server release.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        working-directory: python/llama-index-vector-stores-polign
        run: |
          python -m pip install -e ../  # the client from this checkout, not PyPI
          python -m pip install -e ".[grpc]" pytest pytest-asyncio
      - name: Download the latest polign-server release
        run: |
          set -euo pipefail
          tag="$(curl -fsSL -H "Authorization: Bearer ${{ github.token }}" https://api.github.com/repos/Polign/polign/releases/latest | python3 -c 'import sys,json; print(json.load(sys.stdin)["tag_name"])')"
          echo "resolved ${tag}"
          mkdir -p "$RUNNER_TEMP/polign"
          curl -fsSL "https://github.com/Polign/polign/releases/download/${tag}/polign_db_linux_amd64.tar.gz" | tar -xz -C "$RUNNER_TEMP/polign"
          echo "POLIGN_SERVER=$RUNNER_TEMP/polign/polign-server" >> "$GITHUB_ENV"
      - name: Tests
        working-directory: python/llama-index-vector-stores-polign
        run: pytest -v

  livekit:
    # Recall memory for LiveKit voice agents: unit tests over a fake Recall
    # subprocess on the supported range, then the real `polign mcp` and server
    # from the latest release.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        working-directory: python/recall-livekit
        run: python -m pip install -e . pytest pytest-asyncio "moto[server]>=5.1,<6"
      - name: Unit tests
        working-directory: python/recall-livekit
        run: pytest tests/unit_tests -q
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Install GCS emulator
        run: |
          GOBIN="$RUNNER_TEMP/gcs-bin" go install github.com/fsouza/fake-gcs-server@v1.55.0
          echo "FAKE_GCS_SERVER=$RUNNER_TEMP/gcs-bin/fake-gcs-server" >> "$GITHUB_ENV"
      - name: Download the latest polign release
        run: |
          set -euo pipefail
          tag="$(curl -fsSL -H "Authorization: Bearer ${{ github.token }}" https://api.github.com/repos/Polign/polign/releases/latest | python3 -c 'import sys,json; print(json.load(sys.stdin)["tag_name"])')"
          echo "resolved ${tag}"
          mkdir -p "$RUNNER_TEMP/polign"
          curl -fsSL "https://github.com/Polign/polign/releases/download/${tag}/polign_db_linux_amd64.tar.gz" | tar -xz -C "$RUNNER_TEMP/polign"
          echo "POLIGN_SERVER=$RUNNER_TEMP/polign/polign-server" >> "$GITHUB_ENV"
      - name: Integration tests
        working-directory: python/recall-livekit
        run: pytest tests/integration_tests -v
