name: python-publish

# Publishes the Python packages to PyPI:
#   python/vX.Y.Z     -> the `polign` client               (python/)
#   langchain/vX.Y.Z  -> `langchain-polign`                 (python/langchain-polign/)
#   llamaindex/vX.Y.Z -> `llama-index-vector-stores-polign` (python/llama-index-vector-stores-polign/)
#   livekit/vX.Y.Z    -> `recall-livekit`                    (python/recall-livekit/)
#   polign_db/vX.Y.Z  -> `polign_db`, the server and CLI binaries as platform
#                        wheels (python/polign_db/). X.Y.Z is the server release
#                        being repackaged; X.Y.Z.postN repackages it again.
# Server releases use bare `vX.Y.Z` tags created by the release pipeline in
# the private source repository; the prefixes keep the tag lines apart.
#
# Authentication is PyPI trusted publishing: the PyPI project trusts this
# repository, this workflow file, and the `pypi` GitHub environment, so no
# long-lived token is stored anywhere.

on:
  push:
    tags: ["python/v*", "langchain/v*", "llamaindex/v*", "livekit/v*", "polign_db/v*"]

permissions:
  contents: read

jobs:
  pypi:
    if: ${{ !startsWith(github.ref_name, 'polign_db/') }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # OIDC token for PyPI trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve the package from the tag prefix
        run: |
          case "$GITHUB_REF_NAME" in
            python/v*)    echo "PKG_DIR=python" >> "$GITHUB_ENV"
                          echo "PKG_VERSION=${GITHUB_REF_NAME#python/v}" >> "$GITHUB_ENV"
                          echo "PKG_INIT=polign/__init__.py" >> "$GITHUB_ENV"
                          echo "PKG_MARKER=polign/client.py" >> "$GITHUB_ENV" ;;
            langchain/v*) echo "PKG_DIR=python/langchain-polign" >> "$GITHUB_ENV"
                          echo "PKG_VERSION=${GITHUB_REF_NAME#langchain/v}" >> "$GITHUB_ENV"
                          echo "PKG_INIT=langchain_polign/__init__.py" >> "$GITHUB_ENV"
                          echo "PKG_MARKER=langchain_polign/vectorstores.py" >> "$GITHUB_ENV" ;;
            llamaindex/v*) echo "PKG_DIR=python/llama-index-vector-stores-polign" >> "$GITHUB_ENV"
                          echo "PKG_VERSION=${GITHUB_REF_NAME#llamaindex/v}" >> "$GITHUB_ENV"
                          echo "PKG_INIT=" >> "$GITHUB_ENV"
                          echo "PKG_MARKER=llama_index/vector_stores/polign/base.py" >> "$GITHUB_ENV" ;;
            livekit/v*)   echo "PKG_DIR=python/recall-livekit" >> "$GITHUB_ENV"
                          echo "PKG_VERSION=${GITHUB_REF_NAME#livekit/v}" >> "$GITHUB_ENV"
                          echo "PKG_INIT=" >> "$GITHUB_ENV"
                          echo "PKG_MARKER=recall_livekit/agent.py" >> "$GITHUB_ENV" ;;
            *)            echo "::error::unexpected tag ${GITHUB_REF_NAME}"; exit 1 ;;
          esac

      # The package version is bumped by hand in two places; make a mismatch
      # with the tag fail here instead of publishing a stray version.
      - name: Check the package version matches the tag
        run: |
          cd "$PKG_DIR"
          pkg="$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)"
          if [ "$PKG_VERSION" != "$pkg" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} implies version ${PKG_VERSION}, but ${PKG_DIR}/pyproject.toml says ${pkg}"
            exit 1
          fi
          if [ -n "$PKG_INIT" ]; then
            fallback="$(grep -m1 '^    __version__ = "' "$PKG_INIT" | cut -d'"' -f2)"
            if [ "$PKG_VERSION" != "$fallback" ]; then
              echo "::error::${PKG_INIT} fallback __version__ is ${fallback}, expected ${PKG_VERSION}"
              exit 1
            fi
          fi

      - name: Build sdist and wheel
        run: |
          cd "$PKG_DIR"
          python -m pip install build
          python -m build

      - name: Check the wheel is not empty
        run: cd "$PKG_DIR" && python -m zipfile -l dist/*.whl | grep -q "$PKG_MARKER"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ env.PKG_DIR }}/dist
          # PyPI uploads are immutable; a re-run of an already published
          # version is left alone instead of failing the job.
          skip-existing: true

  # The binary wheels are not built from source. The job downloads the server
  # release's archives, checks the release signature and every checksum, and
  # repackages `polign` and `polign-server` into one wheel per platform.
  polign_db:
    if: ${{ startsWith(github.ref_name, 'polign_db/') }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # OIDC token for PyPI trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: sigstore/cosign-installer@v3

      - name: Download the release and verify its signature
        run: |
          set -euo pipefail
          PKG_VERSION="${GITHUB_REF_NAME#polign_db/v}"
          V="v${PKG_VERSION%%.post*}"
          echo "PKG_VERSION=${PKG_VERSION}" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/release" && cd "$RUNNER_TEMP/release"
          BASE="https://github.com/Polign/polign/releases/download/${V}"
          for f in checksums.txt checksums.txt.sigstore.json \
                   polign_db_darwin_amd64.tar.gz polign_db_darwin_arm64.tar.gz \
                   polign_db_linux_amd64.tar.gz polign_db_linux_arm64.tar.gz \
                   polign_db_windows_amd64.zip polign_db_windows_arm64.zip; do
            curl -fsSLO "${BASE}/${f}"
          done
          cosign verify-blob \
            --bundle checksums.txt.sigstore.json \
            --certificate-identity="https://github.com/Polign/polign_db/.github/workflows/release.yml@refs/tags/${V}" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            checksums.txt

      # build_wheels.py refuses any archive whose SHA-256 is not the one in the
      # checksums.txt verified above.
      - name: Build the wheels
        run: python python/polign_db/build_wheels.py --version "$PKG_VERSION" --archives "$RUNNER_TEMP/release" --out dist

      - name: Install the Linux wheel and run both binaries
        run: |
          set -euo pipefail
          python -m pip install dist/polign_db-*manylinux2014_x86_64*.whl
          cd "$RUNNER_TEMP"
          test "$(python -c 'import polign_db; print(polign_db.__version__)')" = "$PKG_VERSION"
          polign-server -version
          "$(python -c 'import polign_db; print(polign_db.find_bin("polign"))')" recall setup -local -no-plugin -config-dir "$RUNNER_TEMP/recall-smoke"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
