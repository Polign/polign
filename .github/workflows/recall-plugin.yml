name: recall-plugin
on:
  pull_request:
    paths: ['plugins/recall/**', 'tests/recall_launcher.py', '.github/workflows/recall-plugin.yml']
  push:
    branches: [main]
    paths: ['plugins/recall/**', 'tests/recall_launcher.py', '.github/workflows/recall-plugin.yml']
permissions:
  contents: read
jobs:
  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/recall_launcher.py
      - run: sh -n plugins/recall/scripts/start.sh
